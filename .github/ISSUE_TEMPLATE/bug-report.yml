name: Example client bug
description: Report a reproducible problem in a repository example.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, customer assets, account data, or full paid responses.
  - type: input
    id: api
    attributes:
      label: Creative API
      description: API name or slug involved.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Example client
      options:
        - cURL
        - JavaScript
        - Python
        - Catalog or documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
